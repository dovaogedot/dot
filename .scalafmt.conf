version = 3.11.5
runner.dialect = scala3

maxColumn = 120

# The hand layout carries the style — leading operator chains, colon lambdas,
# braced definition bodies — so line breaks are preserved, not re-decided.
newlines.source = keep
newlines.avoidAfterYield = false

indent.main = 2
indent.defnSite = 2
indent.callSite = 2

# Alignment groups end at blank lines. Definition `=` alignment covers vals
# only, so a val never stretches to meet a def signature.
align.preset = none
align.tokens = [
  { code = "<-" },
  { code = "->" },
  { code = "=>", owners = [{ regex = "Case" }] },
  { code = "=", owners = [{ regex = "(Defn\\.Va(l|r)|Enumerator\\.Val)" }] },
]

rewrite.trailingCommas.style = always

docstrings.style = keep
docstrings.wrap = no

# Literal argument lists stay one-per-line as written.
binPack.literalArgumentLists = false

project.excludePaths = ["glob:**/.scala-build/**"]
